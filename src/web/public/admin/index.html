<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Rayzell Store PPOB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1 { font-family: 'Sora','Inter',sans-serif; letter-spacing:-.01em; }
    [data-theme="dark"]  { --bg:#070711;--card:#10101f;--border:rgba(255,255,255,.09);--text:#e8e9f3;--muted:#9aa0b4;--btn:#7c5cff;--btn-text:#fff;--input-bg:#0b0b18;--input-border:rgba(255,255,255,.15); }
    [data-theme="light"] { --bg:#f1f5f9;--card:#ffffff;--border:rgba(0,0,0,.12);--text:#0f172a;--muted:#64748b;--btn:#6366f1;--btn-text:#fff;--input-bg:#ffffff;--input-border:rgba(0,0,0,.2); }
    input::placeholder { opacity: 0.45; }
    input:focus { outline: 2px solid #7c5cff !important; outline-offset: 1px; }
  </style>
</head>
<body style="background:var(--bg);color:var(--text)" class="min-h-screen flex items-center justify-center px-4 transition-colors duration-200">
  <button id="themeBtn" onclick="toggleTheme()" class="fixed top-4 right-4 rounded-full border px-3 py-1 text-xs font-medium" style="border-color:var(--border);color:var(--muted)">
    <span id="themeLabel">Light</span>
  </button>
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <span class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-2xl shadow-lg shadow-indigo-500/40" style="background:linear-gradient(135deg,#7c5cff,#22d3ee)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="white"/></svg></span>
      <h1 class="text-xl font-extrabold tracking-wide" style="background:linear-gradient(90deg,#a78bfa,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent">RAYZELL STORE PPOB</h1>
      <p class="mt-1 text-sm" style="color:var(--muted)">Panel Admin</p>
    </div>
    <div class="rounded-2xl p-6 sm:p-8" style="background:var(--card);border:1px solid var(--border)">
      <div id="errBox" class="mb-4 hidden rounded-xl p-3 text-sm text-rose-400" style="background:rgba(244,63,94,.08)"></div>
      <form id="loginForm" onsubmit="doLogin(event)" class="space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium">Username</label>
          <input id="uname" type="text" required autocomplete="username" placeholder="admin"
                 class="w-full rounded-xl px-4 py-3 text-sm outline-none"
                 style="background:var(--input-bg);border:1.5px solid var(--input-border);color:var(--text)" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium">Password</label>
          <input id="pass" type="password" required autocomplete="current-password" placeholder="••••••••"
                 class="w-full rounded-xl px-4 py-3 text-sm outline-none"
                 style="background:var(--input-bg);border:1.5px solid var(--input-border);color:var(--text)" />
        </div>
        <button type="submit" id="loginBtn" class="w-full rounded-xl py-3 font-semibold text-sm transition hover:opacity-90"
                style="background:var(--btn);color:var(--btn-text)">Masuk</button>
      </form>
    </div>
  </div>
  <script>
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeLabel').textContent = saved === 'dark' ? 'Light' : 'Dark';
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('themeLabel').textContent = next === 'dark' ? 'Light' : 'Dark';
    }
    if (localStorage.getItem('admin_token')) window.location = '/admin/dashboard.html';
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errBox');
      btn.disabled = true; btn.textContent = 'Masuk…'; err.classList.add('hidden');
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('uname').value, password: document.getElementById('pass').value }),
        });
        const j = await r.json();
        if (j.ok) { localStorage.setItem('admin_token', j.token); window.location = '/admin/dashboard.html'; }
        else { err.textContent = j.message || 'Username atau password salah.'; err.classList.remove('hidden'); }
      } catch (ex) { err.textContent = 'Gagal terhubung ke server.'; err.classList.remove('hidden'); }
      finally { btn.disabled = false; btn.textContent = 'Masuk'; }
    }
  </script>
</body>
</html>
