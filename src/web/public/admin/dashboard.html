<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin — Rayzell Store PPOB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2 { font-family: 'Sora','Inter',sans-serif; letter-spacing:-.01em; }
    [data-theme="dark"]  { --bg:#070711;--card:#10101f;--border:rgba(255,255,255,.09);--text:#e8e9f3;--muted:#9aa0b4;--btn:#fff;--btn-text:#0f172a;--row:rgba(255,255,255,.025); }
    [data-theme="light"] { --bg:#f1f5f9;--card:#ffffff;--border:rgba(0,0,0,.12);--text:#0f172a;--muted:#475569;--btn:#0f172a;--btn-text:#fff;--row:rgba(0,0,0,.025); }
    /* Badge status kontras di light mode */
    [data-theme="light"] .badge-sukses  { color: #059669 !important; }
    [data-theme="light"] .badge-gagal   { color: #dc2626 !important; }
    [data-theme="light"] .badge-pending { color: #d97706 !important; }
  </style>
</head>
<body style="background:var(--bg);color:var(--text)" class="min-h-screen transition-colors duration-200">
  <header class="sticky top-0 z-20 border-b" style="background:var(--card);border-color:var(--border)">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
      <div class="flex items-center gap-2.5">
        <span class="grid h-9 w-9 place-items-center rounded-xl shadow-md" style="background:linear-gradient(135deg,#7c5cff,#22d3ee)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="white"/></svg></span>
        <span class="font-extrabold text-sm tracking-wide" style="font-family:'Sora',sans-serif;background:linear-gradient(90deg,#a78bfa,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent">RAYZELL STORE PPOB</span>
        <span style="color:var(--muted)" class="text-xs font-normal">— Admin</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleTheme()" class="rounded-full border px-3 py-1 text-xs font-medium" style="border-color:var(--border);color:var(--muted)"><span id="themeLabel">Light</span></button>
        <button onclick="logout()" class="rounded-full border px-3 py-1 text-xs font-medium" style="border-color:var(--border);color:var(--muted)">Keluar</button>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-5 py-8">
    <!-- STATS -->
    <div class="mb-8 grid grid-cols-2 gap-3 sm:grid-cols-4">
      <div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
        <div class="text-xs font-medium" style="color:var(--muted)">Total Pengguna</div>
        <div class="mt-2 text-2xl font-bold" id="statUsers">—</div>
      </div>
      <div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
        <div class="text-xs font-medium" style="color:var(--muted)">Total Transaksi</div>
        <div class="mt-2 text-2xl font-bold" id="statTrx">—</div>
      </div>
      <div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
        <div class="text-xs font-medium" style="color:var(--muted)">Omzet Hari Ini</div>
        <div class="mt-2 text-2xl font-bold" id="statRevenue">—</div>
      </div>
      <div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
        <div class="text-xs font-medium" style="color:var(--muted)">Saldo Digiflazz</div>
        <div class="mt-2 text-2xl font-bold" id="statDeposit">—</div>
      </div>
    </div>
    <!-- TRANSAKSI -->
    <div class="rounded-2xl mb-6" style="background:var(--card);border:1px solid var(--border)">
      <div class="flex items-center justify-between border-b px-6 py-4" style="border-color:var(--border)">
        <h2 class="font-semibold">Transaksi Terbaru</h2>
        <button onclick="loadData()" class="text-xs font-medium hover:opacity-70" style="color:var(--muted)">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b" style="border-color:var(--border)">
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Ref ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Produk</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Tujuan</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Harga</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Status</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Waktu</th>
          </tr></thead>
          <tbody id="trxBody"><tr><td colspan="6" class="px-6 py-8 text-center text-sm" style="color:var(--muted)">Memuat…</td></tr></tbody>
        </table>
      </div>
    </div>
    <!-- TOP UP PENDING -->
    <div class="rounded-2xl" style="background:var(--card);border:1px solid var(--border)">
      <div class="flex items-center justify-between border-b px-6 py-4" style="border-color:var(--border)">
        <h2 class="font-semibold">Top Up Pending <span id="pendingBadge" class="ml-2 hidden rounded-full bg-amber-500 px-2 py-0.5 text-xs text-white"></span></h2>
        <button onclick="loadData()" class="text-xs font-medium hover:opacity-70" style="color:var(--muted)">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b" style="border-color:var(--border)">
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">#</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">User</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Nominal</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Waktu</th>
            <th class="px-6 py-3 text-left text-xs font-medium" style="color:var(--muted)">Aksi</th>
          </tr></thead>
          <tbody id="topupBody"><tr><td colspan="5" class="px-6 py-8 text-center text-sm" style="color:var(--muted)">Memuat…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- BANNER PRODUK -->
    <div class="mt-6 rounded-2xl" style="background:var(--card);border:1px solid var(--border)">
      <div class="flex items-center justify-between border-b px-6 py-4" style="border-color:var(--border)">
        <h2 class="font-semibold">Banner Per-Produk</h2>
        <span class="text-xs" style="color:var(--muted)">Gambar kecil di atas kartu produk di web store</span>
      </div>
      <div class="p-6">
        <!-- Step 1: Kategori -->
        <div class="grid gap-3 sm:flex sm:items-end sm:gap-4">
          <div class="flex-1">
            <label class="mb-1 block text-xs font-medium" style="color:var(--muted)">Kategori</label>
            <select id="bannerCat" class="w-full rounded-xl px-3 py-2.5 text-sm" style="background:var(--bg);border:1px solid var(--border);color:var(--text)">
              <option value="">— Pilih kategori —</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="mb-1 block text-xs font-medium" style="color:var(--muted)">Brand</label>
            <select id="bannerBrand" class="w-full rounded-xl px-3 py-2.5 text-sm" disabled style="background:var(--bg);border:1px solid var(--border);color:var(--text)">
              <option value="">— Pilih brand —</option>
            </select>
          </div>
          <button onclick="loadBannerProducts()" class="rounded-xl px-5 py-2.5 text-sm font-semibold" style="background:var(--btn);color:var(--btn-text)">Tampilkan</button>
        </div>
        <!-- Daftar produk dengan input banner -->
        <div id="bannerList" class="mt-5 space-y-3"></div>
      </div>
    </div>
  </main>
  <script>
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeLabel').textContent = saved === 'dark' ? 'Light' : 'Dark';
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('themeLabel').textContent = next === 'dark' ? 'Light' : 'Dark';
    }
    function logout() { localStorage.removeItem('admin_token'); window.location = '/admin/'; }
    function token() { return localStorage.getItem('admin_token') || ''; }
    function ah() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() }; }
    function rupiah(n) { return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }
    function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function badge(s) {
      const cls = { Sukses:'text-emerald-600 badge-sukses', Gagal:'text-rose-600 badge-gagal', Pending:'text-amber-600 badge-pending' };
      return `<span class="font-semibold ${cls[s]||'text-slate-500'}">${s}</span>`;
    }
    async function loadData() {
      if (!token()) { window.location = '/admin/'; return; }
      try {
        const r = await fetch('/api/admin/stats', { headers: ah() });
        if (r.status === 401) { logout(); return; }
        const j = await r.json();
        if (j.ok) {
          document.getElementById('statUsers').textContent = j.data.users;
          document.getElementById('statTrx').textContent = j.data.transactions;
          document.getElementById('statRevenue').textContent = rupiah(j.data.todayRevenue);
          document.getElementById('statDeposit').textContent = j.data.digiDeposit != null ? rupiah(j.data.digiDeposit) : '—';
        }
      } catch(e){}
      try {
        const r = await fetch('/api/admin/transactions?limit=20', { headers: ah() });
        const j = await r.json();
        const tb = document.getElementById('trxBody');
        if (!j.ok||!j.data.length) { tb.innerHTML='<tr><td colspan="6" class="px-6 py-8 text-center" style="color:var(--muted)">Belum ada transaksi.</td></tr>'; }
        else tb.innerHTML = j.data.map(t=>`<tr class="border-b hover:opacity-80" style="border-color:var(--border);background:var(--row)">
          <td class="px-6 py-3 font-mono text-xs">${esc(t.ref_id)}</td>
          <td class="px-6 py-3">${esc(t.product_name||'—')}</td>
          <td class="px-6 py-3">${esc(t.target||'—')}</td>
          <td class="px-6 py-3">${rupiah(t.sell_price)}</td>
          <td class="px-6 py-3">${badge(t.status)}</td>
          <td class="px-6 py-3 text-xs" style="color:var(--muted)">${esc(t.waktu)}</td>
        </tr>`).join('');
      } catch(e){}
      try {
        const r = await fetch('/api/admin/topups/pending', { headers: ah() });
        const j = await r.json();
        const tb = document.getElementById('topupBody');
        const b  = document.getElementById('pendingBadge');
        if (!j.ok||!j.data.length) { tb.innerHTML='<tr><td colspan="5" class="px-6 py-8 text-center" style="color:var(--muted)">Tidak ada top up pending.</td></tr>'; b.classList.add('hidden'); }
        else {
          b.textContent = j.data.length; b.classList.remove('hidden');
          tb.innerHTML = j.data.map(d=>`<tr class="border-b hover:opacity-80" style="border-color:var(--border);background:var(--row)">
            <td class="px-6 py-3 text-xs">#${esc(d.id)}</td>
            <td class="px-6 py-3">${esc(d.user_name)} <span class="text-xs" style="color:var(--muted)">(${esc(d.user_id)})</span></td>
            <td class="px-6 py-3 font-semibold">${rupiah(d.amount)}</td>
            <td class="px-6 py-3 text-xs" style="color:var(--muted)">${esc(d.waktu)}</td>
            <td class="px-6 py-3">
              <button onclick="act(${d.id},'approve')" class="mr-2 rounded-lg px-3 py-1 text-xs font-semibold hover:opacity-80" style="background:#10b981;color:#fff">Setujui</button>
              <button onclick="act(${d.id},'reject')"  class="rounded-lg px-3 py-1 text-xs font-semibold hover:opacity-80" style="background:#f43f5e;color:#fff">Tolak</button>
            </td>
          </tr>`).join('');
        }
      } catch(e){}
    }
    async function act(id, action) {
      const label = action === 'approve' ? 'Setujui' : 'Tolak';
      if (!confirm(`${label} top up #${id}?`)) return;
      const r = await fetch(`/api/admin/topups/${id}/${action}`, { method:'POST', headers: ah() });
      const j = await r.json();
      alert(j.message || (j.ok ? 'Berhasil.' : 'Gagal.'));
      loadData();
    }
    if (!token()) window.location = '/admin/';
    else { loadData(); setInterval(loadData, 30000); initBanner(); }

    // ===== BANNER PRODUK =====
    async function initBanner() {
      try {
        const r = await fetch('/api/admin/products/categories', { headers: ah() });
        const j = await r.json();
        if (!j.ok || !j.data.length) return;
        const sel = document.getElementById('bannerCat');
        j.data.forEach(c => sel.innerHTML += `<option value="${esc(c.category)}">${esc(c.category)} (${c.c})</option>`);
        sel.addEventListener('change', loadBannerBrands);
        document.getElementById('bannerBrand').addEventListener('change', () => {});
      } catch(e){}
    }

    async function loadBannerBrands() {
      const cat = document.getElementById('bannerCat').value;
      const brandSel = document.getElementById('bannerBrand');
      brandSel.innerHTML = '<option value="">— Pilih brand —</option>';
      brandSel.disabled = true;
      document.getElementById('bannerList').innerHTML = '';
      if (!cat) return;
      try {
        const r = await fetch('/api/admin/products/brands?category=' + encodeURIComponent(cat), { headers: ah() });
        const j = await r.json();
        if (!j.ok || !j.data.length) return;
        j.data.forEach(b => brandSel.innerHTML += `<option value="${esc(b.brand)}">${esc(b.brand)} (${b.c})</option>`);
        brandSel.disabled = false;
      } catch(e){}
    }

    async function loadBannerProducts() {
      const cat = document.getElementById('bannerCat').value;
      const brand = document.getElementById('bannerBrand').value;
      const box = document.getElementById('bannerList');
      if (!cat || !brand) { box.innerHTML = '<p class="text-sm" style="color:var(--muted)">Pilih kategori &amp; brand dulu.</p>'; return; }
      box.innerHTML = '<p class="text-sm" style="color:var(--muted)">Memuat…</p>';
      try {
        const r = await fetch('/api/admin/products/list?category=' + encodeURIComponent(cat) + '&brand=' + encodeURIComponent(brand), { headers: ah() });
        const j = await r.json();
        if (!j.ok || !j.data.length) { box.innerHTML = '<p class="text-sm" style="color:var(--muted)">Tidak ada produk.</p>'; return; }
        box.innerHTML = j.data.map(p => `
          <div class="flex flex-col gap-2 rounded-xl p-4 sm:flex-row sm:items-center sm:gap-3" style="background:var(--bg);border:1px solid var(--border)">
            <div class="min-w-0 flex-1">
              <div class="truncate text-sm font-semibold">${esc(p.product_name)}</div>
              <div class="text-[11px]" style="color:var(--muted)">${esc(p.buyer_sku_code)} · ${rupiah(p.price)}</div>
              ${p.banner_url ? `<img src="${esc(p.banner_url)}" alt="banner" class="mt-2 h-10 w-auto rounded" onerror="this.style.display='none'">` : ''}
            </div>
            <div class="flex gap-2 sm:w-64">
              <input id="banner_${esc(p.buyer_sku_code)}" type="text" placeholder="https://... (kosong = hapus)" value="${esc(p.banner_url||'')}"
                class="w-full rounded-lg px-3 py-2 text-xs" style="background:var(--card);border:1px solid var(--border);color:var(--text)"/>
              <button onclick="saveBanner('${esc(p.buyer_sku_code)}')" class="shrink-0 rounded-lg px-3 py-2 text-xs font-semibold" style="background:var(--btn);color:var(--btn-text)">Simpan</button>
            </div>
          </div>`).join('');
      } catch(e){ box.innerHTML = '<p class="text-sm text-rose-400">Gagal memuat.</p>'; }
    }

    async function saveBanner(sku) {
      const input = document.getElementById('banner_' + sku);
      if (!input) return;
      const url = input.value.trim();
      try {
        const r = await fetch('/api/admin/products/' + encodeURIComponent(sku) + '/banner', {
          method: 'PUT', headers: ah(), body: JSON.stringify({ url })
        });
        const j = await r.json();
        if (j.ok) {
          input.style.borderColor = '#10b981';
          setTimeout(() => input.style.borderColor = '', 1500);
          loadBannerProducts();
        } else {
          alert(j.message || 'Gagal simpan.');
        }
      } catch(e){ alert('Gagal terhubung.'); }
    }
  </script>
</body>
</html>
